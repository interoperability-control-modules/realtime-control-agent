[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "volttron-realtime-control"
version = "0.2"
description = "The real-time control agent: runs the control evaluation engine against live resources."
authors = [{name = "David Raker", email = "david.raker@pnnl.gov"}]
license = "Apache-2.0"
license-files = ["LICENSE", "COPYRIGHT.md"]
readme = "README.md"
requires-python = ">=3.10,<4.0"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Developers",
]
dependencies = [
    "volttron-core>=2.0.0rc30",   # the modular platform; classic VOLTTRON 10/11 is supported through the import fallbacks
    "julia>=0.6.2",
]

[project.scripts]
volttron-realtime-control = "rt_control.agent:main"

[project.urls]
Repository = "https://github.com/interoperability-control-modules/realtime-control-agent"
Homepage = "https://github.com/interoperability-control-modules/realtime-control-agent"

[tool.poetry]
packages = [{ include = "rt_control" }]

[tool.isort]
profile = "black"
ignore_whitespace = true

[tool.mypy]
python_version = 3.10
show_error_context = true
pretty = true
show_column_numbers = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
exclude = ['docs/']

[tool.yapf]
based_on_style = "pep8"
spaces_before_comment = 4
column_limit = 99
split_before_logical_operator = true

[tool.yapfignore]
ignore_patterns = [
    ".venv/**",
    ".pytest_cache/**",
    "dist/**",
    "docs/**"
]
